version: '3.8'

services:

  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: shivangi
      MYSQL_DATABASE: jobtracker



    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pshivangi"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: jobtracker-container

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8080:8080"

volumes:
  mysql-data: